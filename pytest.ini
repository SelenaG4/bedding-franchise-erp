[pytest]
# Without this, pytest's default "prepend" import mode only puts the
# directory containing the collected test files on sys.path. This repo's
# tests/ has no __init__.py, so that directory is just tests/ itself --
# `from app import services` then fails with ModuleNotFoundError, even
# though the exact same command works locally if you happen to have
# invoked pytest a different way. This bit CI (see README).
pythonpath = .
